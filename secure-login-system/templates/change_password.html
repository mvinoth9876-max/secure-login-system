{% extends "base.html" %}{% block title %}Change Password{% endblock %}
{% block content %}<div class="card narrow"><h1>Change password</h1><form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<label>Current password</label><input type="password" name="current_password" required autocomplete="current-password">
<label>New password</label><input type="password" name="new_password" required minlength="8" autocomplete="new-password">
<label>Confirm new password</label><input type="password" name="confirm_password" required autocomplete="new-password">
<button class="btn full">Update password</button></form></div>{% endblock %}
