{% extends "base.html" %}{% block title %}Login · SecureLogin{% endblock %}
{% block content %}
<div class="card narrow"><h1>Welcome back</h1><p class="muted">Sign in to your secure account.</p>
<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<label>Username or email</label><input name="identity" required autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button class="btn full" type="submit">Sign in</button>
</form><p class="center muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>
{% endblock %}
