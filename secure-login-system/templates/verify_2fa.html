{% extends "base.html" %}{% block title %}Verify 2FA{% endblock %}
{% block content %}<div class="card narrow"><h1>Two-factor verification</h1><p class="muted">Enter the 6-digit code from your authenticator app.</p>
<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Authentication code</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button class="btn full">Verify</button></form></div>{% endblock %}
